# Render Blueprint (FREE tier). New > Blueprint > pick this repo.
# Free web services have no persistent disk, so the SQLite database, uploaded PDFs and
# saved rule settings reset on every deploy, restart or idle spin-down. Fine for demos.
# Free services also sleep after ~15 min idle; the first request then takes ~30-60 s.
services:
  - type: web
    name: vendor-onboarding
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DEMO_DELAY
        value: "0.7"
      - key: MOCK_LLM
        value: "0"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false          # enter in the Render dashboard; never commit it
